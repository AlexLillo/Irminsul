<header>
  <h1>Irminsul</h1>
  <p>Explore the game catalog</p>
</header>

<main>
  <h2>Game catalog</h2>

  @if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
  } @else if (isLoading()) {
  <p>Cargando catálogo...</p>
  } @else if (games().length === 0) {
  <p>No hay juegos disponibles en el catálogo.</p>
  } @else {
  <section>
    @for (game of games(); track game.id) {
    <app-game-card
      [gameId]="game.id"
      [title]="game.title"
      [coverUrl]="game.coverUrl"
      [genre]="game.genre"
      [platforms]="game.platforms"
      context="catalog"
    />
    }
  </section>
  }
</main>
