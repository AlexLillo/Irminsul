<header class="site-header">
  <nav class="navbar" aria-label="Main navigation">
    <a routerLink="/" class="brand">Irminsul</a>

    <div class="links">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >Catalog</a>

      @if (authService.isLoggedIn()) {
      <a routerLink="/home" routerLinkActive="active">My Library</a>

      @if (authService.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active">Administration</a>
      }

      <button type="button" class="logout" (click)="logout()">Log Out</button>
      } @else {
      <a routerLink="/login" routerLinkActive="active">Log In</a>
      <a routerLink="/register" class="btn btn-primary">Sign Up</a>
      }
    </div>
  </nav>
</header>
