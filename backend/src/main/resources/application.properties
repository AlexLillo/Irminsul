spring.application.name=irminsul

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:irminsul}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update

# Demo data (users, games, ratings) created on first startup when the database is empty.
# Set SEED_DATA=false in any deployment reachable from the Internet.
app.seed.enabled=${SEED_DATA:true}